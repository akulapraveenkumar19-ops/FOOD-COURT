<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#386641"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
    <linearGradient id="dosaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9c46a"/>
      <stop offset="50%" stop-color="#f4a261"/>
      <stop offset="100%" stop-color="#e76f51"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="90" fill="#fdf0d5"/>
  <!-- Banana leaf plate -->
  <ellipse cx="100" cy="108" rx="85" ry="58" fill="url(#plateGrad)"/>
  <path d="M 15 108 Q 100 112, 185 108" stroke="#52b788" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Rolled Golden Crispy Dosa (Cone/Roll) -->
  <polygon points="20,120 180,82 170,128" fill="url(#dosaGrad)"/>
  <ellipse cx="170" cy="105" rx="8" ry="22" fill="#c86d3b"/>
  <!-- Crispy texture streaks -->
  <line x1="60" y1="112" x2="150" y2="92" stroke="#b5651d" stroke-width="2" opacity="0.7"/>
  <line x1="80" y1="117" x2="160" y2="100" stroke="#b5651d" stroke-width="2" opacity="0.7"/>
  <!-- Chutney Bowls -->
  <!-- Coconut Chutney -->
  <circle cx="50" cy="72" r="14" fill="#ffffff" stroke="#c0c0c0" stroke-width="2"/>
  <circle cx="50" cy="72" r="12" fill="#f8f9fa"/>
  <circle cx="49" cy="70" r="1.5" fill="#2b2d42"/>
  <circle cx="53" cy="73" r="1.5" fill="#2b2d42"/>
  <!-- Tomato Chutney -->
  <circle cx="85" cy="65" r="14" fill="#ffffff" stroke="#c0c0c0" stroke-width="2"/>
  <circle cx="85" cy="65" r="12" fill="#e63946"/>
  <!-- Sambar Bowl -->
  <circle cx="125" cy="65" r="16" fill="#ffffff" stroke="#c0c0c0" stroke-width="2"/>
  <circle cx="125" cy="65" r="14" fill="#d4a373"/>
  <circle cx="122" cy="63" r="3" fill="#2a9d8f"/>
</svg>
