<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d405b"/>
      <stop offset="100%" stop-color="#1d1e2c"/>
    </linearGradient>
    <linearGradient id="riceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4a261"/>
      <stop offset="30%" stop-color="#ffe8d6"/>
      <stop offset="60%" stop-color="#e76f51"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="90" fill="#fff7ed"/>
  <!-- Serving Bowl -->
  <path d="M 30 110 C 30 165, 170 165, 170 110 Z" fill="url(#bowlGrad)"/>
  <ellipse cx="100" cy="110" rx="70" ry="16" fill="#4a4e69"/>
  <!-- Biryani Rice Mound -->
  <ellipse cx="100" cy="102" rx="66" ry="32" fill="url(#riceGrad)"/>
  <!-- Rice grains details -->
  <ellipse cx="80" cy="95" rx="5" ry="1.5" fill="#ffffff" transform="rotate(25 80 95)"/>
  <ellipse cx="120" cy="98" rx="5" ry="1.5" fill="#ffffff" transform="rotate(-30 120 98)"/>
  <ellipse cx="100" cy="90" rx="5" ry="1.5" fill="#ffffff" transform="rotate(10 100 90)"/>
  <ellipse cx="65" cy="105" rx="4" ry="1.5" fill="#ffffff" transform="rotate(40 65 105)"/>
  <ellipse cx="135" cy="106" rx="4" ry="1.5" fill="#ffffff" transform="rotate(-15 135 106)"/>
  <!-- Fried Onions (Birista) -->
  <path d="M 75 90 Q 82 86, 90 92" stroke="#6f4e37" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 110 88 Q 118 84, 125 91" stroke="#6f4e37" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Mint/Coriander Leaves -->
  <circle cx="100" cy="80" r="7" fill="#2a9d8f"/>
  <circle cx="93" cy="82" r="5" fill="#52b788"/>
  <circle cx="107" cy="82" r="5" fill="#52b788"/>
  <!-- Boiled Egg / Paneer cube -->
  <ellipse cx="100" cy="100" rx="12" ry="8" fill="#ffffff"/>
  <ellipse cx="100" cy="100" rx="6" ry="4" fill="#fb8500"/>
  <!-- Spices: Star Anise / Clove -->
  <polygon points="125,90 127,96 133,96 128,100 130,106 125,102 120,106 122,100 117,96 123,96" fill="#582f0e" transform="scale(0.8) translate(30, 10)"/>
</svg>
