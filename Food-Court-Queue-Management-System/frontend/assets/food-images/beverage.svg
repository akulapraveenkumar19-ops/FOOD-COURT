<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="drinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48cae4"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <linearGradient id="cupBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0f3f4"/>
      <stop offset="100%" stop-color="#dee2e6"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="90" fill="#edf6f9"/>
  <!-- Bent Straw -->
  <path d="M 125 15 L 125 35 L 105 85" stroke="#e63946" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Plastic Cup Lid -->
  <ellipse cx="100" cy="65" rx="46" ry="10" fill="#e9ecef" stroke="#ced4da" stroke-width="2"/>
  <ellipse cx="100" cy="63" rx="42" ry="7" fill="#dee2e6"/>
  <!-- Cup Body -->
  <polygon points="56,65 144,65 132,168 68,168" fill="url(#cupBodyGrad)" stroke="#ced4da" stroke-width="1.5"/>
  <!-- Liquid Content Window / Wave -->
  <path d="M 60 90 Q 80 84, 100 90 T 140 90 L 130 162 L 70 162 Z" fill="url(#drinkGrad)" opacity="0.85"/>
  <!-- Ice cubes inside -->
  <rect x="75" y="98" width="16" height="16" rx="3" fill="#ffffff" opacity="0.6" transform="rotate(15 75 98)"/>
  <rect x="105" y="105" width="15" height="15" rx="3" fill="#ffffff" opacity="0.6" transform="rotate(-20 105 105)"/>
  <rect x="85" y="125" width="14" height="14" rx="3" fill="#ffffff" opacity="0.6" transform="rotate(8 85 125)"/>
  <!-- Lemon slice garnish on rim -->
  <circle cx="68" cy="65" r="14" fill="#ffd166" stroke="#f4a261" stroke-width="2"/>
  <circle cx="68" cy="65" r="10" fill="#ffe494"/>
  <line x1="58" y1="65" x2="78" y2="65" stroke="#f4a261" stroke-width="1"/>
  <line x1="68" y1="55" x2="68" y2="75" stroke="#f4a261" stroke-width="1"/>
  <!-- Bubbles / Condensation -->
  <circle cx="118" cy="140" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="82" cy="150" r="2.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="122" cy="120" r="2" fill="#ffffff" opacity="0.7"/>
</svg>
